<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1.5" fill="#22C55E20"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FAFAFA"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect x="0" y="0" width="6" height="500" fill="#22C55E"/>
  <rect x="6" y="0" width="794" height="80" fill="#1A1A2E"/>
  <text x="40" y="32" font-family="Georgia, serif" font-size="11" fill="#22C55E" letter-spacing="3">PERSONA 03</text>
  <text x="40" y="60" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white">L'Otaku Confirmé</text>
  <text x="680" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#22C55E60">NAKAMA</text>

  <!-- Avatar -->
  <rect x="40" y="108" width="120" height="150" rx="4" fill="#E8F5E9" stroke="#22C55E40" stroke-width="1"/>
  <circle cx="100" cy="160" r="28" fill="#C8E8C8" stroke="none"/>
  <ellipse cx="100" cy="210" rx="38" ry="22" fill="#C8E8C8"/>
  <text x="100" y="248" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">Avatar</text>

  <!-- Infos -->
  <text x="190" y="128" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1A1A2E">Théo, 23 ans</text>
  <text x="190" y="150" font-family="Georgia, serif" font-size="13" fill="#888">Développeur web junior · Bordeaux</text>
  <line x1="190" y1="160" x2="760" y2="160" stroke="#22C55E30" stroke-width="1"/>

  <!-- Tags -->
  <rect x="190" y="170" width="75" height="20" rx="10" fill="#22C55E15" stroke="#22C55E" stroke-width="0.75"/>
  <text x="227" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#22C55E">Expert</text>
  <rect x="273" y="170" width="115" height="20" rx="10" fill="#22C55E15" stroke="#22C55E" stroke-width="0.75"/>
  <text x="330" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#22C55E">Anime + Manga</text>
  <rect x="396" y="170" width="115" height="20" rx="10" fill="#22C55E15" stroke="#22C55E" stroke-width="0.75"/>
  <text x="453" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#22C55E">Stats addict</text>

  <!-- Citation -->
  <rect x="190" y="200" width="550" height="50" rx="4" fill="#22C55E08" stroke="#22C55E30" stroke-width="1"/>
  <text x="200" y="222" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#555">"J'utilise MAL depuis des années mais c'est en anglais et plein de trucs</text>
  <text x="200" y="240" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#555">inutiles. Je veux juste mes stats et des recommandations pertinentes."</text>

  <!-- Contexte -->
  <text x="40" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#22C55E" letter-spacing="2">CONTEXTE</text>
  <line x1="40" y1="300" x2="220" y2="300" stroke="#22C55E" stroke-width="0.75"/>
  <text x="40" y="318" font-family="Georgia, serif" font-size="11" fill="#444">+300 animes/mangas au compteur</text>
  <text x="40" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Utilise MAL mais insatisfait</text>
  <text x="40" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Très actif sur les forums</text>
  <text x="40" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Partage ses listes avec des amis</text>

  <!-- Frustrations -->
  <text x="230" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#E94560" letter-spacing="2">FRUSTRATIONS</text>
  <line x1="230" y1="300" x2="460" y2="300" stroke="#E9456040" stroke-width="0.75"/>
  <text x="230" y="318" font-family="Georgia, serif" font-size="11" fill="#444">MAL uniquement en anglais</text>
  <text x="230" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Recommandations peu pertinentes</text>
  <text x="230" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Stats trop basiques sur MAL</text>
  <text x="230" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Interface surchargée de pubs</text>

  <!-- Attentes -->
  <text x="470" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#22C55E" letter-spacing="2">ATTENTES</text>
  <line x1="470" y1="300" x2="760" y2="300" stroke="#22C55E40" stroke-width="0.75"/>
  <text x="470" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Dashboard avec stats détaillées</text>
  <text x="470" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Recommandations par genre aimé</text>
  <text x="470" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Profil public consultable</text>
  <text x="470" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Interface propre sans pub</text>

  <!-- Features -->
  <text x="40" y="410" font-family="monospace" font-size="9" font-weight="bold" fill="#1A1A2E" letter-spacing="2">FEATURES CLÉS</text>
  <line x1="40" y1="415" x2="760" y2="415" stroke="#1A1A2E20" stroke-width="0.75"/>

  <rect x="40" y="425" width="130" height="26" rx="4" fill="#1A1A2E"/>
  <text x="105" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">Suivi progression</text>

  <rect x="180" y="425" width="130" height="26" rx="4" fill="#1A1A2E"/>
  <text x="245" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">Dashboard + stats</text>

  <rect x="320" y="425" width="130" height="26" rx="4" fill="#1A1A2E"/>
  <text x="385" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">Recommandations</text>

  <rect x="460" y="425" width="130" height="26" rx="4" fill="#22C55E30" stroke="#22C55E" stroke-width="0.75"/>
  <text x="525" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#22C55E">Profil public</text>

  <rect x="600" y="425" width="130" height="26" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="0.75"/>
  <text x="665" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#aaa">Admin panel</text>

  <text x="760" y="490" text-anchor="end" font-family="monospace" font-size="8" fill="#bbb">NAKAMA — Personas UX · 2025</text>
</svg>
