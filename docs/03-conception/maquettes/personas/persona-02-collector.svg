<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1.5" fill="#FF6B3520"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FAFAFA"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect x="0" y="0" width="6" height="500" fill="#FF6B35"/>
  <rect x="6" y="0" width="794" height="80" fill="#1A1A2E"/>
  <text x="40" y="32" font-family="Georgia, serif" font-size="11" fill="#FF6B35" letter-spacing="3">PERSONA 02</text>
  <text x="40" y="60" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white">Le Collectionneur</text>
  <text x="680" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FF6B3560">NAKAMA</text>

  <!-- Avatar -->
  <rect x="40" y="108" width="120" height="150" rx="4" fill="#F0EAE8" stroke="#FF6B3540" stroke-width="1"/>
  <circle cx="100" cy="160" r="28" fill="#D8C8C0" stroke="none"/>
  <ellipse cx="100" cy="210" rx="38" ry="22" fill="#D8C8C0"/>
  <text x="100" y="248" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">Avatar</text>

  <!-- Infos -->
  <text x="190" y="128" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1A1A2E">Camille, 26 ans</text>
  <text x="190" y="150" font-family="Georgia, serif" font-size="13" fill="#888">Étudiante en design · Lyon</text>
  <line x1="190" y1="160" x2="760" y2="160" stroke="#FF6B3530" stroke-width="1"/>

  <!-- Tags -->
  <rect x="190" y="170" width="90" height="20" rx="10" fill="#FF6B3515" stroke="#FF6B35" stroke-width="0.75"/>
  <text x="235" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF6B35">Confirmée</text>
  <rect x="288" y="170" width="110" height="20" rx="10" fill="#FF6B3515" stroke="#FF6B35" stroke-width="0.75"/>
  <text x="343" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF6B35">Manga collector</text>
  <rect x="406" y="170" width="105" height="20" rx="10" fill="#FF6B3515" stroke="#FF6B35" stroke-width="0.75"/>
  <text x="458" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF6B35">Desktop + Mobile</text>

  <!-- Citation -->
  <rect x="190" y="200" width="550" height="50" rx="4" fill="#FF6B3508" stroke="#FF6B3530" stroke-width="1"/>
  <text x="200" y="222" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#555">"J'ai plus de 200 tomes chez moi. J'ai besoin de savoir exactement</text>
  <text x="200" y="240" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#555">où j'en suis dans chaque série sans devoir tout noter dans Excel."</text>

  <!-- Contexte -->
  <text x="40" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#FF6B35" letter-spacing="2">CONTEXTE</text>
  <line x1="40" y1="300" x2="220" y2="300" stroke="#FF6B35" stroke-width="0.75"/>
  <text x="40" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Collectionne les mangas depuis 8 ans</text>
  <text x="40" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Achète en librairie spécialisée</text>
  <text x="40" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Suit aussi quelques animes</text>
  <text x="40" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Connaît MAL mais préfère le français</text>

  <!-- Frustrations -->
  <text x="230" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#E94560" letter-spacing="2">FRUSTRATIONS</text>
  <line x1="230" y1="300" x2="460" y2="300" stroke="#E9456040" stroke-width="0.75"/>
  <text x="230" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Suivi des tomes ET chapitres séparés</text>
  <text x="230" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Aucun outil pour collection physique</text>
  <text x="230" y="350" font-family="Georgia, serif" font-size="11" fill="#444">MAL mélange anime et manga</text>
  <text x="230" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Pas de gestion du statut publication</text>

  <!-- Attentes -->
  <text x="470" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#22C55E" letter-spacing="2">ATTENTES</text>
  <line x1="470" y1="300" x2="760" y2="300" stroke="#22C55E40" stroke-width="0.75"/>
  <text x="470" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Séparation claire Anime / Manga</text>
  <text x="470" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Suivi tome ET chapitre actuel</text>
  <text x="470" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Statut publication (en cours / fini)</text>
  <text x="470" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Partager sa liste avec la communauté</text>

  <!-- Features -->
  <text x="40" y="410" font-family="monospace" font-size="9" font-weight="bold" fill="#1A1A2E" letter-spacing="2">FEATURES CLÉS</text>
  <line x1="40" y1="415" x2="760" y2="415" stroke="#1A1A2E20" stroke-width="0.75"/>

  <rect x="40" y="425" width="130" height="26" rx="4" fill="#1A1A2E"/>
  <text x="105" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">Suivi progression</text>

  <rect x="180" y="425" width="130" height="26" rx="4" fill="#1A1A2E"/>
  <text x="245" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">nb_volumes + chapitres</text>

  <rect x="320" y="425" width="130" height="26" rx="4" fill="#FF6B3530" stroke="#FF6B35" stroke-width="0.75"/>
  <text x="385" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF6B35">Profil public</text>

  <rect x="460" y="425" width="130" height="26" rx="4" fill="#FF6B3530" stroke="#FF6B35" stroke-width="0.75"/>
  <text x="525" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF6B35">Filtres avancés</text>

  <rect x="600" y="425" width="130" height="26" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="0.75"/>
  <text x="665" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#aaa">Admin panel</text>

  <text x="760" y="490" text-anchor="end" font-family="monospace" font-size="8" fill="#bbb">NAKAMA — Personas UX · 2025</text>
</svg>
