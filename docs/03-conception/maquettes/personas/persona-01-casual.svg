<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1.5" fill="#5B4FE920"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#FAFAFA"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="500" fill="#5B4FE9"/>

  <!-- Header band -->
  <rect x="6" y="0" width="794" height="80" fill="#1A1A2E"/>
  <text x="40" y="32" font-family="Georgia, serif" font-size="11" fill="#5B4FE9" letter-spacing="3">PERSONA 01</text>
  <text x="40" y="60" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white">Le Fan Casual</text>
  <text x="680" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5B4FE960">NAKAMA</text>

  <!-- Avatar placeholder -->
  <rect x="40" y="108" width="120" height="150" rx="4" fill="#E8E8F0" stroke="#5B4FE940" stroke-width="1"/>
  <circle cx="100" cy="160" r="28" fill="#C8C8E0" stroke="none"/>
  <ellipse cx="100" cy="210" rx="38" ry="22" fill="#C8C8E0"/>
  <text x="100" y="248" text-anchor="middle" font-family="monospace" font-size="9" fill="#888">Avatar</text>

  <!-- Infos de base -->
  <text x="190" y="128" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1A1A2E">Lucas, 17 ans</text>
  <text x="190" y="150" font-family="Georgia, serif" font-size="13" fill="#888">Lycéen · Paris</text>
  <line x1="190" y1="160" x2="760" y2="160" stroke="#5B4FE930" stroke-width="1"/>

  <!-- Tags -->
  <rect x="190" y="170" width="80" height="20" rx="10" fill="#5B4FE915" stroke="#5B4FE9" stroke-width="0.75"/>
  <text x="230" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B4FE9">Débutant</text>
  <rect x="278" y="170" width="95" height="20" rx="10" fill="#5B4FE915" stroke="#5B4FE9" stroke-width="0.75"/>
  <text x="325" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B4FE9">Anime only</text>
  <rect x="381" y="170" width="80" height="20" rx="10" fill="#5B4FE915" stroke="#5B4FE9" stroke-width="0.75"/>
  <text x="421" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B4FE9">Mobile first</text>

  <!-- Citation -->
  <rect x="190" y="200" width="550" height="50" rx="4" fill="#5B4FE908" stroke="#5B4FE930" stroke-width="1"/>
  <text x="200" y="222" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#555">"J'ai commencé à regarder des animes avec des amis, mais j'oublie</text>
  <text x="200" y="240" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#555">toujours à quel épisode j'en suis. J'ai pas envie d'un truc compliqué."</text>

  <!-- Colonnes infos -->
  <!-- Colonne 1 - Contexte -->
  <text x="40" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#5B4FE9" letter-spacing="2">CONTEXTE</text>
  <line x1="40" y1="300" x2="220" y2="300" stroke="#5B4FE9" stroke-width="0.75"/>
  <text x="40" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Découvre les animes via ses amis</text>
  <text x="40" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Utilise son smartphone 90% du temps</text>
  <text x="40" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Suit 3 à 5 séries en parallèle</text>
  <text x="40" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Faible niveau d'anglais</text>

  <!-- Colonne 2 - Frustrations -->
  <text x="230" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#E94560" letter-spacing="2">FRUSTRATIONS</text>
  <line x1="230" y1="300" x2="460" y2="300" stroke="#E9456040" stroke-width="0.75"/>
  <text x="230" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Oublie régulièrement son épisode</text>
  <text x="230" y="334" font-family="Georgia, serif" font-size="11" fill="#444">MAL et AniList sont en anglais</text>
  <text x="230" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Interfaces trop complexes</text>
  <text x="230" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Se fait spoiler par erreur</text>

  <!-- Colonne 3 - Attentes -->
  <text x="470" y="295" font-family="monospace" font-size="9" font-weight="bold" fill="#22C55E" letter-spacing="2">ATTENTES</text>
  <line x1="470" y1="300" x2="760" y2="300" stroke="#22C55E40" stroke-width="0.75"/>
  <text x="470" y="318" font-family="Georgia, serif" font-size="11" fill="#444">Interface simple en français</text>
  <text x="470" y="334" font-family="Georgia, serif" font-size="11" fill="#444">Mise à jour rapide en 2 clics</text>
  <text x="470" y="350" font-family="Georgia, serif" font-size="11" fill="#444">Voir ce que ses amis regardent</text>
  <text x="470" y="366" font-family="Georgia, serif" font-size="11" fill="#444">Découvrir de nouvelles séries</text>

  <!-- Features clés utilisées -->
  <text x="40" y="410" font-family="monospace" font-size="9" font-weight="bold" fill="#1A1A2E" letter-spacing="2">FEATURES CLÉS</text>
  <line x1="40" y1="415" x2="760" y2="415" stroke="#1A1A2E20" stroke-width="0.75"/>

  <rect x="40" y="425" width="130" height="26" rx="4" fill="#1A1A2E" stroke="none"/>
  <text x="105" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">Suivi progression</text>

  <rect x="180" y="425" width="130" height="26" rx="4" fill="#1A1A2E" stroke="none"/>
  <text x="245" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="white">Interface française</text>

  <rect x="320" y="425" width="130" height="26" rx="4" fill="#5B4FE930" stroke="#5B4FE9" stroke-width="0.75"/>
  <text x="385" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B4FE9">Recommandations</text>

  <rect x="460" y="425" width="130" height="26" rx="4" fill="#5B4FE930" stroke="#5B4FE9" stroke-width="0.75"/>
  <text x="525" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#5B4FE9">Profil public</text>

  <rect x="600" y="425" width="130" height="26" rx="4" fill="#f0f0f0" stroke="#ddd" stroke-width="0.75"/>
  <text x="665" y="442" text-anchor="middle" font-family="monospace" font-size="9" fill="#aaa">Admin panel</text>

  <!-- Footer -->
  <text x="760" y="490" text-anchor="end" font-family="monospace" font-size="8" fill="#bbb">NAKAMA — Personas UX · 2025</text>
</svg>
