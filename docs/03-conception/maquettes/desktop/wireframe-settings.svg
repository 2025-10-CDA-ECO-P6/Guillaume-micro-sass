<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <defs>
    <pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0 8L8 0" stroke="#aaa" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="420" fill="white"/>
  <text x="300" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#333">SETTINGS / EDIT PROFILE</text>

  <!-- Browser frame -->
  <rect x="10" y="28" width="580" height="382" fill="white" stroke="#222" stroke-width="2"/>
  <!-- Navbar -->
  <rect x="10" y="28" width="580" height="28" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
  <text x="35" y="46" font-family="monospace" font-size="9" fill="#555">← retour</text>
  <text x="265" y="46" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#222">NAKAMA</text>
  <circle cx="570" cy="42" r="9" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Layout 2 colonnes -->
  <!-- Sidebar gauche -->
  <rect x="20" y="65" width="140" height="330" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="90" y="85" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#222">MON COMPTE</text>
  <line x1="25" y1="90" x2="155" y2="90" stroke="#ddd" stroke-width="0.75"/>

  <!-- Menu items sidebar -->
  <rect x="20" y="96" width="140" height="26" fill="#333" stroke="none"/>
  <text x="90" y="113" text-anchor="middle" font-family="monospace" font-size="8" fill="white">Profil</text>
  <line x1="25" y1="122" x2="155" y2="122" stroke="#ddd" stroke-width="0.5"/>
  <text x="90" y="137" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">Sécurité</text>
  <line x1="25" y1="147" x2="155" y2="147" stroke="#ddd" stroke-width="0.5"/>
  <text x="90" y="162" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">Confidentialité</text>
  <line x1="25" y1="172" x2="155" y2="172" stroke="#ddd" stroke-width="0.5"/>
  <text x="90" y="187" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">Notifications</text>
  <line x1="25" y1="197" x2="155" y2="197" stroke="#ddd" stroke-width="0.5"/>
  <text x="90" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#aaa">Supprimer compte</text>

  <!-- Contenu principal -->
  <text x="178" y="82" font-family="monospace" font-size="10" font-weight="bold" fill="#222">MODIFIER MON PROFIL</text>
  <line x1="178" y1="88" x2="580" y2="88" stroke="#555" stroke-width="0.75"/>

  <!-- Avatar + upload -->
  <circle cx="220" cy="128" r="30" fill="url(#h)" stroke="#333" stroke-width="1.5"/>
  <rect x="260" y="112" width="110" height="20" fill="#333" stroke="#222" stroke-width="1"/>
  <text x="315" y="126" text-anchor="middle" font-family="monospace" font-size="8" fill="white">Changer l'avatar</text>
  <text x="260" y="148" font-family="monospace" font-size="7.5" fill="#aaa">JPG, PNG — max 2Mo</text>

  <!-- Formulaire -->
  <text x="178" y="173" font-family="monospace" font-size="8" fill="#888">Pseudo</text>
  <rect x="178" y="177" width="250" height="20" fill="white" stroke="#333" stroke-width="1.5"/>

  <text x="178" y="210" font-family="monospace" font-size="8" fill="#888">Email</text>
  <rect x="178" y="214" width="250" height="20" fill="white" stroke="#333" stroke-width="1.5"/>

  <text x="178" y="247" font-family="monospace" font-size="8" fill="#888">Nouveau mot de passe</text>
  <rect x="178" y="251" width="250" height="20" fill="white" stroke="#333" stroke-width="1.5"/>

  <text x="178" y="284" font-family="monospace" font-size="8" fill="#888">Confirmer mot de passe</text>
  <rect x="178" y="288" width="250" height="20" fill="white" stroke="#333" stroke-width="1.5"/>

  <!-- Toggle is_public -->
  <line x1="178" y1="322" x2="580" y2="322" stroke="#ddd" stroke-width="0.75"/>
  <text x="178" y="337" font-family="monospace" font-size="9" font-weight="bold" fill="#222">CONFIDENTIALITÉ</text>
  <text x="178" y="354" font-family="monospace" font-size="8" fill="#555">Profil visible publiquement</text>
  <!-- Toggle switch -->
  <rect x="450" y="346" width="36" height="16" rx="8" fill="#333" stroke="#222" stroke-width="1"/>
  <circle cx="478" cy="354" r="6" fill="white" stroke="#555" stroke-width="0.5"/>
  <text x="493" y="358" font-family="monospace" font-size="8" fill="#555">ON</text>

  <!-- Bouton save -->
  <rect x="178" y="370" width="120" height="24" fill="#333" stroke="#222" stroke-width="1.5"/>
  <text x="238" y="386" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="white">[ SAUVEGARDER ]</text>
  <rect x="310" y="370" width="90" height="24" fill="white" stroke="#666" stroke-width="1"/>
  <text x="355" y="386" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">[ ANNULER ]</text>
</svg>
