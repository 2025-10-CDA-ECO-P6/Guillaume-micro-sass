<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <defs>
    <pattern id="h" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0 8L8 0" stroke="#aaa" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="420" fill="white"/>

  <!-- Label -->
  <text x="300" y="20" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#333">LOGIN / REGISTER</text>

  <!-- Browser frame -->
  <rect x="10" y="28" width="580" height="380" fill="white" stroke="#222" stroke-width="2"/>
  <!-- Navbar -->
  <rect x="10" y="28" width="580" height="28" fill="#f0f0f0" stroke="#222" stroke-width="1"/>
  <rect x="20" y="35" width="35" height="10" fill="#ccc" rx="2"/>
  <rect x="60" y="35" width="35" height="10" fill="#ccc" rx="2"/>
  <rect x="130" y="33" width="340" height="14" fill="white" stroke="#888" stroke-width="1" rx="2"/>
  <text x="300" y="43" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">nakama.app/login</text>
  <rect x="490" y="35" width="35" height="10" fill="#ccc" rx="2"/>
  <rect x="530" y="35" width="35" height="10" fill="#ccc" rx="2"/>

  <!-- Centered card -->
  <rect x="175" y="70" width="250" height="330" fill="white" stroke="#222" stroke-width="1.5"/>

  <!-- Logo block -->
  <rect x="195" y="85" width="210" height="28" fill="#eee" stroke="#222" stroke-width="1"/>
  <text x="300" y="104" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#222">NAKAMA</text>

  <!-- Tabs -->
  <rect x="195" y="122" width="100" height="18" fill="#333" stroke="#222" stroke-width="1"/>
  <text x="245" y="134" text-anchor="middle" font-family="monospace" font-size="8" fill="white">CONNEXION</text>
  <rect x="295" y="122" width="110" height="18" fill="white" stroke="#222" stroke-width="1"/>
  <text x="350" y="134" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">INSCRIPTION</text>

  <!-- Email -->
  <text x="198" y="155" font-family="monospace" font-size="8" fill="#888">Email</text>
  <rect x="195" y="158" width="210" height="18" fill="white" stroke="#222" stroke-width="1"/>

  <!-- Password -->
  <text x="198" y="188" font-family="monospace" font-size="8" fill="#888">Mot de passe</text>
  <rect x="195" y="191" width="210" height="18" fill="white" stroke="#222" stroke-width="1"/>

  <!-- Forgot password -->
  <line x1="198" y1="216" x2="295" y2="216" stroke="#aaa" stroke-width="1"/>

  <!-- Button -->
  <rect x="195" y="222" width="210" height="24" fill="#333" stroke="#222" stroke-width="1"/>
  <text x="300" y="238" text-anchor="middle" font-family="monospace" font-size="9" fill="white">[ SE CONNECTER ]</text>

  <!-- Link line -->
  <line x1="220" y1="258" x2="380" y2="258" stroke="#bbb" stroke-width="1"/>

  <!-- Inscription state (dashed, ghosted) -->
  <rect x="195" y="275" width="210" height="100" fill="white" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="295" text-anchor="middle" font-family="monospace" font-size="8" fill="#aaa">+ Champ pseudo</text>
  <text x="300" y="315" text-anchor="middle" font-family="monospace" font-size="8" fill="#aaa">+ Confirmation mdp</text>
  <text x="300" y="335" text-anchor="middle" font-family="monospace" font-size="8" fill="#aaa">[ S'INSCRIRE ]</text>
  <text x="300" y="365" text-anchor="middle" font-family="monospace" font-size="8" font-style="italic" fill="#aaa">(onglet Inscription)</text>
</svg>
