# =============================================================================
# Nakama — environnement de développement (4 services)
# Les secrets viennent du fichier .env (copie de .env.example, jamais commité).
# =============================================================================
services:
  database:
    image: postgres:17
    container_name: nakama-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}                 # superuser : admin et sauvegardes uniquement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NAKAMA_MIGRATION_PASSWORD: ${NAKAMA_MIGRATION_PASSWORD}
      NAKAMA_APP_PASSWORD: ${NAKAMA_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"                         # accessible depuis ta machine (DBeaver), pas depuis le réseau
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/01-init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: nakama-redis
    restart: unless-stopped
    # Mot de passe obligatoire. Persistance AOF : les tokens vivent 24 h (CDC), un
    # redémarrage de Redis ne doit pas « dé-révoquer » un token pendant ce temps.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Pas de "ports:" : seul le backend y accède, via le réseau Docker interne
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: nakama-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DB_APP_USER: nakama_app
      DB_APP_PASSWORD: ${NAKAMA_APP_PASSWORD}
      DB_MIGRATION_USER: nakama_migration
      DB_MIGRATION_PASSWORD: ${NAKAMA_MIGRATION_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nakama-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
